[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: send every route to index.html (functions under /.netlify/functions are not affected)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
